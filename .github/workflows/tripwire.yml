# Généré par /tripwire:init — la CI n'appelle que scripts/check.sh (invariant).
# Image kicad/kicad épinglée sur la version EXACTE du poste local (10.0.4) :
# un autre patch de KiCad change les comptes ERC/DRC et fausse la baseline
# (constaté : 10.0.5 en CI vs 10.0.4 local -> +5 warnings DRC). Monter les deux ensemble.
# Étages : fast (ERC) sur PR, full (ERC+DRC) sur main + nightly.
name: tripwire
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"   # nightly full — supprimer si inutile

jobs:
  check-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.4
      options: --user root   # l'image tourne en user kicad ; root évite les soucis de droits sur le workspace
    env:
      HOME: /root   # kicad-cli veut un HOME inscriptible pour sa config
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check.sh --fast
      - if: failure()
        name: Détail de l'échec (last-fail.log + version kicad)
        run: |
          kicad-cli version || true
          cat .git/tripwire/last-fail.log || true
          echo "--- comptes bruts ERC/DRC dans CET environnement ---"
          ./scripts/kicad-check.sh erc || true
          ./scripts/kicad-check.sh drc || true

  check-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.4
      options: --user root
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check.sh
      - if: failure()
        name: Détail de l'échec (last-fail.log + version kicad)
        run: |
          kicad-cli version || true
          cat .git/tripwire/last-fail.log || true
          echo "--- comptes bruts ERC/DRC dans CET environnement ---"
          ./scripts/kicad-check.sh erc || true
          ./scripts/kicad-check.sh drc || true
